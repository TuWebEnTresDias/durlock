<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Esquema ilustrativo de un sistema de Durlock</title>
  <desc id="desc">Representación conceptual de placas de yeso y una estructura de perfiles metálicos.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f0"/>
      <stop offset="1" stop-color="#e9eedf"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#e9ece1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#26372d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="34" fill="url(#paper)"/>
  <circle cx="774" cy="116" r="118" fill="#d9eb76" opacity=".27"/>
  <text x="58" y="68" fill="#65764a" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="800" letter-spacing="2.5">DURLOCK · ESQUEMA ILUSTRATIVO</text>
  <text x="58" y="124" fill="#202b28" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="750" letter-spacing="-1">Una pared, vista por dentro</text>

  <g filter="url(#shadow)">
    <rect x="42" y="158" width="816" height="484" rx="28" fill="#f7f7ef" stroke="#d8dfce" stroke-width="2"/>
  </g>

  <g font-family="system-ui,-apple-system,sans-serif">
    <text x="106" y="213" fill="#758344" font-size="20" font-weight="800" letter-spacing="1.5">01 / PLACA DE YESO</text>
    <text x="526" y="213" fill="#758344" font-size="20" font-weight="800" letter-spacing="1.5">02 / ESTRUCTURA</text>
  </g>

  <!-- Cara visible de placas de yeso -->
  <g>
    <rect x="102" y="239" width="326" height="274" rx="10" fill="url(#board)" stroke="#33443b" stroke-width="5"/>
    <path d="M265 241v270" stroke="#d4d9ce" stroke-width="4"/>
    <path d="M112 250h306" stroke="#ffffff" stroke-width="4" opacity=".9"/>
    <g fill="#66755c">
      <circle cx="132" cy="274" r="5"/><circle cx="244" cy="274" r="5"/><circle cx="286" cy="274" r="5"/><circle cx="398" cy="274" r="5"/>
      <circle cx="132" cy="376" r="5"/><circle cx="244" cy="376" r="5"/><circle cx="286" cy="376" r="5"/><circle cx="398" cy="376" r="5"/>
      <circle cx="132" cy="478" r="5"/><circle cx="244" cy="478" r="5"/><circle cx="286" cy="478" r="5"/><circle cx="398" cy="478" r="5"/>
    </g>
    <g fill="none" stroke="#a7b094" stroke-width="2">
      <path d="M126 274h12m-6-6v12M238 376h12m-6-6v12M392 478h12m-6-6v12"/>
    </g>
  </g>

  <!-- Transición entre la placa y la estructura -->
  <g fill="none" stroke="#899777" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M445 376h48"/>
    <path d="m478 360 16 16-16 16"/>
  </g>

  <!-- Estructura esquemática de perfiles y montantes -->
  <g>
    <rect x="516" y="239" width="280" height="274" rx="10" fill="#edf1e5" stroke="#d0d9c8" stroke-width="3"/>
    <path d="M542 266h228v24H559v192h194v24H542z" fill="#d9eb76" stroke="#3d5143" stroke-width="5" stroke-linejoin="round"/>
    <path d="M610 290v190M680 290v190" fill="none" stroke="#5b6b59" stroke-width="16" stroke-linecap="round"/>
    <path d="M610 290v190M680 290v190" fill="none" stroke="#f4f4e9" stroke-width="4" stroke-linecap="round" opacity=".95"/>
    <path d="M559 345h194M559 414h194" fill="none" stroke="#a6b58b" stroke-width="4" stroke-dasharray="8 10"/>
    <circle cx="610" cy="319" r="5" fill="#33443b"/><circle cx="680" cy="319" r="5" fill="#33443b"/>
    <circle cx="610" cy="449" r="5" fill="#33443b"/><circle cx="680" cy="449" r="5" fill="#33443b"/>
  </g>

  <g font-family="system-ui,-apple-system,sans-serif">
    <rect x="102" y="546" width="326" height="48" rx="24" fill="#e7ecd9"/>
    <circle cx="130" cy="570" r="7" fill="#758c32"/>
    <text x="151" y="577" fill="#435348" font-size="20" font-weight="700">Placas</text>
    <rect x="516" y="546" width="280" height="48" rx="24" fill="#e7ecd9"/>
    <circle cx="544" cy="570" r="7" fill="#758c32"/>
    <text x="565" y="577" fill="#435348" font-size="20" font-weight="700">Perfiles metálicos</text>
    <text x="450" y="625" fill="#69766a" font-size="15" font-weight="650" text-anchor="middle">Representación conceptual · no corresponde a una obra realizada</text>
  </g>
</svg>